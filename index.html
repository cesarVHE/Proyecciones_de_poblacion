<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Proyecciones de Población - México (1990-2040)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
          
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background-color: #f4f6f9;
        }

        /* Contenedor Principal en Pantalla Completa */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* Barra de Herramientas Superior (Filtros) */
        #navbar {
            background-color: #2c3e50;
            color: white;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
        }

        #navbar h1 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-right: 10px;
            color: #ecf0f1;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: #bdc3c7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #34495e;
            background-color: #34495e;
            color: white;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .filter-group select:hover {
            background-color: #415b76;
        }

        /* Botones de acción y descarga */
        .btn-group {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }

        #btn-clear {
            background-color: #e67e22;
        }
        #btn-clear:hover { background-color: #d35400; }

        #btn-export-xlsx {
            background-color: #27ae60;
        }
        #btn-export-xlsx:hover { background-color: #219653; }

        #btn-export-geojson {
            background-color: #8e44ad;
        }
        #btn-export-geojson:hover { background-color: #7d3c98; }

        /* Contenedor del Mapa */
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }

        /* Estilos de la Leyenda de Leaflet */
        .info.legend {
            background: white;
            padding: 10px 14px;
            font-size: 0.85rem;
            line-height: 18px;
            color: #333;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 6px;
        }

        .info.legend h4 {
            margin: 0 0 6px;
            color: #2c3e50;
            font-size: 0.9rem;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }

        .info.legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.85;
            border-radius: 2px;
        }

        @media (max-width: 900px) {
            #navbar { padding: 10px; gap: 10px; }
            .btn-group { margin-left: 0; width: 100%; justify-content: flex-start; }
            #navbar h1 { width: 100%; margin-bottom: 2px; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="navbar">
            <h1>Demografía México</h1>
            
            <div class="filter-group">
                <label for="select-year">Año:</label>
                <select id="select-year">
                    <option value="">Cargando años...</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="select-sex">Sexo:</label>
                <select id="select-sex">
                    <option value="TODOS" selected>Ambos Sexos</option>
                    <option value="HOMBRES">Hombres</option>
                    <option value="MUJERES">Mujeres</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="select-age">Grupo Edad:</label>
                <select id="select-age">
                    <option value="POB_TOTAL" selected>Población Total</option>
                    <option value="POB_00_04">0 a 4 años</option>
                    <option value="POB_05_09">5 a 9 años</option>
                    <option value="POB_10_14">10 a 14 años</option>
                    <option value="POB_15_19">15 a 19 años</option>
                    <option value="POB_20_24">20 a 24 años</option>
                    <option value="POB_25_29">25 a 29 años</option>
                    <option value="POB_30_34">30 a 34 años</option>
                    <option value="POB_35_39">35 a 39 años</option>
                    <option value="POB_40_44">40 a 44 años</option>
                    <option value="POB_45_49">45 a 49 años</option>
                    <option value="POB_50_54">50 a 54 años</option>
                    <option value="POB_55_59">55 a 59 años</option>
                    <option value="POB_60_64">60 a 64 años</option>
                    <option value="POB_65_69">65 a 69 años</option>
                    <option value="POB_70_74">70 a 74 años</option>
                    <option value="POB_75_79">75 a 79 años</option>
                    <option value="POB_80_84">80 a 84 años</option>
                    <option value="POB_85_mm">85 años o más</option>
                </select>
            </div>

            <div class="btn-group">
                <button id="btn-clear" class="btn">Restablecer</button>
                <button id="btn-export-xlsx" class="btn">Exportar XLSX</button>
                <button id="btn-export-geojson" class="btn">Exportar GeoJSON</button>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script src="index.js"></script>
</body>
</html>
